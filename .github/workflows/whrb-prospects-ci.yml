name: whrb-prospects CI

on:
  pull_request:
    paths:
      - 'whrb-prospects/**'
      - '.github/workflows/whrb-prospects-ci.yml'
  push:
    branches: [main]
    paths:
      - 'whrb-prospects/**'
      - '.github/workflows/whrb-prospects-ci.yml'

concurrency:
  group: whrb-prospects-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whrb-prospects
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: whrb-prospects/.python-version
          cache: pip
          cache-dependency-path: |
            whrb-prospects/requirements.lock
            whrb-prospects/requirements-dev.lock
      - name: Install dependencies (pinned lock)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest with coverage gate
        # Two coverage gates run in series:
        #   1. Whole-package floor (28%, defined in pyproject.toml under
        #      [tool.coverage.report]). Catches regressions across all of
        #      util/, enrich/, db/, sources/, etc.
        #   2. Narrower 70% gate on util/+enrich/ (post-T7 sweep target).
        #      Sources/ remain HTTP-bound and out of scope; ratchet this
        #      floor up by +5 each PR until 80%.
        # No network, no live Supabase — the autouse stub_event_log
        # fixture replaces util.event_log with an in-memory recorder.
        run: |
          pytest tests/ --cov --cov-report=term
          pytest tests/ \
            --cov=util --cov=enrich \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --no-header --quiet

      - name: pip-audit (lockfile vulnerability scan)
        # Surfaces CVEs in pinned deps. Fails the job on findings; if a
        # finding has no fix yet, add `--ignore-vuln <ID>` here with a
        # comment linking to the advisory.
        run: |
          pip install pip-audit
          pip-audit --strict --requirement requirements.lock --requirement requirements-dev.lock

  multi_email_integrity:
    name: Multi-email integrity (010)
    runs-on: ubuntu-latest
    needs: check
    # Skip on PRs from forks (no access to repo secrets); run on push to main
    # and on PRs from same-repo branches.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    defaults:
      run:
        working-directory: whrb-prospects
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: whrb-prospects/.python-version
          cache: pip
          cache-dependency-path: |
            whrb-prospects/requirements.lock
            whrb-prospects/requirements-dev.lock
      - name: Install dependencies (pinned lock)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock
      - name: Run integrity script (dev Supabase)
        # Walks K1–K10 + I1, I6, I7, I8, I8b against dev Supabase
        # (kolfijjavwruwzctmnlx). Plants a UUID-suffixed fixture, asserts
        # invariants, cleans up. Required GitHub secrets:
        #   SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/multi_email_integrity.py

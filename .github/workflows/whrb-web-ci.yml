name: whrb-web CI

on:
  pull_request:
    paths:
      - 'whrb-web/**'
      - '.github/workflows/whrb-web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'whrb-web/**'
      - '.github/workflows/whrb-web-ci.yml'

concurrency:
  group: whrb-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whrb-web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version-file: whrb-web/.nvmrc
          cache: pnpm
          cache-dependency-path: whrb-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:run
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-stub-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-stub-service-key

  # Stage 6a: Playwright e2e against the Vercel preview deploy.
  # Runs on PRs only (not push-to-main). Waits for Vercel's deployment status
  # on the PR HEAD commit, then drives the preview URL with the full browser
  # test suite.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    # `wait-for-vercel-preview` polls the commit statuses / deployments API on
    # the PR HEAD to resolve the Vercel preview URL. The default GITHUB_TOKEN
    # does not grant those scopes in all repo configurations, so declare them
    # explicitly. Read-only scopes; no write access needed.
    permissions:
      contents: read
      deployments: read
      statuses: read
      checks: read
      pull-requests: read
    defaults:
      run:
        working-directory: whrb-web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version-file: whrb-web/.nvmrc
          cache: pnpm
          cache-dependency-path: whrb-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(pnpm ls @playwright/test --depth=0 --json | node -e "const j=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(j[0].devDependencies['@playwright/test'].version);")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium (with deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Wait for Vercel preview deployment
        id: vercel
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          check_interval: 10

      # Stage 7+ specs expect `whrb-prospects/cache/stage7_snapshot.json` to
      # exist. Plant fixtures in a cleanup-then-plant dance so any leftovers
      # from a prior CI run (or concurrent local run) don't leave stale
      # subjects. The plant script refuses if a snapshot already exists, so
      # cleanup-first is required. Uses the dev Supabase project's service
      # role (same secrets as Playwright).
      - name: Set up Python for fixture planting
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pipeline deps for fixture scripts
        working-directory: whrb-prospects
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Plant Stage 7 fixtures
        working-directory: whrb-prospects
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/stage7_cleanup.py || true
          python scripts/stage7_plant.py

      - name: Run Playwright tests
        run: pnpm e2e
        env:
          CI: 'true'
          E2E_BASE_URL: ${{ steps.vercel.outputs.url }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Tear down Stage 7 fixtures
        if: ${{ always() }}
        working-directory: whrb-prospects
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/stage7_cleanup.py || true

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: whrb-web/playwright-report/
          retention-days: 14

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: whrb-web/test-results/
          retention-days: 14

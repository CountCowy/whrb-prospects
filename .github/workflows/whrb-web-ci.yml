name: whrb-web CI

on:
  pull_request:
    paths:
      - 'whrb-web/**'
      - '.github/workflows/whrb-web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'whrb-web/**'
      - '.github/workflows/whrb-web-ci.yml'

concurrency:
  group: whrb-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whrb-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: whrb-web/.nvmrc
          cache: pnpm
          cache-dependency-path: whrb-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-stub-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-stub-service-key

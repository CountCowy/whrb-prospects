name: external-calendar-sync

# Schedule Feature — periodic Google Calendar ICS pull.
#
# Runs every 15 minutes against every enabled row in
# `schedule_external_calendars`, expanding RRULEs ±6mo/+12mo and
# upserting into `schedule_events` keyed by
# (external_source, external_calendar_id, external_id). The unique
# partial index makes the upsert idempotent and per-feed scoped.
# Rows that vanish from the source feed are tombstoned
# (`metadata.cancelled_in_source=true`) rather than deleted, so reps'
# reminders aren't quietly removed.
#
# Also responds to a `repository_dispatch` event of type
# `sync_external_calendar` from the admin "Sync now" button, which passes
# `client_payload.calendar_id` to scope the run to a single feed.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      calendar_id:
        description: 'UUID of a single feed to sync (optional)'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types:
      - sync_external_calendar

# Limit GITHUB_TOKEN to the minimum: this job needs no repo writes,
# no PR comments, no package access. DB credentials come from a
# separate secret on the run step.
permissions:
  contents: read

concurrency:
  group: external-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync ICS feeds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: whrb-prospects
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: whrb-prospects/.python-version
          cache: pip
          cache-dependency-path: whrb-prospects/requirements.lock

      - name: Install pinned deps from lockfile
        # Lockfile is authoritative. No silent fallback to requirements.txt:
        # an unpinned install would defeat the supply-chain pin and runs
        # on a runner that holds DB credentials. Regenerate the lockfile
        # via `pip-compile` if a new dep is needed; do not loosen this.
        run: pip install --no-deps -r requirements.lock

      - name: Install ICS deps (pinned, not yet in lockfile)
        # icalendar + recurring-ical-events are pinned in requirements.txt
        # via the `==` constraints applied for this job. Once pip-compile
        # is rerun to fold them into requirements.lock, this step can go.
        run: pip install 'icalendar==6.1.0' 'recurring-ical-events==3.4.0'

      - name: Run sync_external_calendars
        # Inputs from repository_dispatch / workflow_dispatch are passed
        # through env, NEVER interpolated into the shell — that's a
        # GitHub Actions script-injection sink. We then validate the
        # value matches a UUID before forwarding to the worker.
        env:
          DISPATCH_CALENDAR_ID: ${{ github.event.client_payload.calendar_id }}
          INPUT_CALENDAR_ID: ${{ github.event.inputs.calendar_id }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          CAL_ID="${DISPATCH_CALENDAR_ID:-${INPUT_CALENDAR_ID:-}}"
          UUID_RE='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if [ -n "$CAL_ID" ]; then
            if ! [[ "$CAL_ID" =~ $UUID_RE ]]; then
              echo "ERROR: calendar_id is not a UUID; refusing to run." >&2
              exit 2
            fi
            python scripts/sync_external_calendars.py --calendar-id "$CAL_ID"
          else
            python scripts/sync_external_calendars.py
          fi

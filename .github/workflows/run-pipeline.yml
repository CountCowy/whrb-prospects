name: run-pipeline

on:
  # Triggered by the Supabase Edge Function `github-dispatch` when a
  # `pipeline_runs` row is INSERTed with status='queued' (the admin
  # "Trigger new run" button path).
  repository_dispatch:
    types: [pipeline_run]
  # Twice-monthly scheduled run (plan §2 decision 5 + §21.2 item 6). Stage 10
  # verifies end-to-end with a temporary `*/5 * * * *` window during the probe
  # and reverts to the production cadence before stage exit.
  schedule:
    # Production cadence — 08:00 UTC on the 1st and 15th (plan §2 decision 5).
    # The `*/5 * * * *` verification probe from Stage 10 T08 was reverted
    # here (T10) after one scheduled fire (pipeline_runs a263ef9e) was
    # observed creating a row with args='--scheduled', triggered_by=null.
    - cron: '0 8 1,15 * *'
  # Manual trigger from the Actions UI (troubleshooting + T04 forced-failure).
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Force the pipeline step to fail by pointing it at an invalid SUPABASE_URL'
        required: false
        default: false
        type: boolean

concurrency:
  group: pipeline-run
  cancel-in-progress: false

jobs:
  run:
    name: Run pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: whrb-prospects
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: whrb-prospects/.python-version
          cache: pip
          cache-dependency-path: |
            whrb-prospects/requirements.lock
            whrb-prospects/requirements-dev.lock

      - name: Install dependencies (pinned lock)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(python -c "import playwright; print(playwright.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-py-${{ steps.pw.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-py-

      - name: Install Playwright Chromium (with deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Adopt or create pipeline_runs row
        id: runrow
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RUN_ID: ${{ github.event.client_payload.pipeline_run_id }}
          # Stage 10c: stamp github.run_id onto the pipeline_runs row so the
          # cancel API can target POST /repos/.../actions/runs/{id}/cancel
          # when admins cancel a running workflow.
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, sys, json
          from datetime import datetime, timezone
          from supabase import create_client
          url = os.environ['SUPABASE_URL']
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          event = os.environ['EVENT_NAME']
          gh_run_id = int(os.environ.get('GITHUB_RUN_ID') or 0) or None
          sb = create_client(url, key)
          now = datetime.now(tz=timezone.utc).isoformat()
          run_id = None
          if event == 'repository_dispatch':
              run_id = os.environ.get('DISPATCH_RUN_ID') or ''
              if not run_id:
                  print('::error::repository_dispatch payload missing pipeline_run_id', file=sys.stderr)
                  sys.exit(1)
              # Flip the queued row to running. If the row doesn't exist or is
              # already running/success/failed, surface the discrepancy and exit.
              update_patch = {
                  'status': 'running',
                  'started_at': now,
              }
              if gh_run_id is not None:
                  update_patch['github_run_id'] = gh_run_id
              res = sb.table('pipeline_runs').update(update_patch).eq('id', run_id).eq('status', 'queued').execute()
              if not res.data:
                  print(f'::warning::no queued row matched id={run_id}; continuing for forensic trace', file=sys.stderr)
          else:
              # schedule or workflow_dispatch — insert a fresh `running` row so
              # the Edge Function (which filters on status='queued') never
              # re-dispatches and creates a loop.
              args_str = '--scheduled' if event == 'schedule' else '--manual'
              insert_row = {
                  'status': 'running',
                  'started_at': now,
                  'triggered_by': None,
                  'args': args_str,
              }
              if gh_run_id is not None:
                  insert_row['github_run_id'] = gh_run_id
              res = sb.table('pipeline_runs').insert(insert_row).execute()
              run_id = (res.data[0] if res.data else {}).get('id')
              if not run_id:
                  print('::error::failed to insert pipeline_runs row', file=sys.stderr)
                  sys.exit(1)
          # Stage 10c: read back the `args` column for repository_dispatch so
          # the Run pipeline step below can honor admin-selected flags.
          # Schedule / workflow_dispatch paths keep the hardcoded --with-hic
          # invocation (those `args` values are markers like '--scheduled',
          # not real pipeline.py flags).
          args_out = ''
          if event == 'repository_dispatch':
              fetched = sb.table('pipeline_runs').select('args').eq('id', run_id).single().execute()
              raw = (fetched.data or {}).get('args') or ''
              # Defensive: strip the --stage10c-fixture sentinel if it
              # slipped through the dispatch-skip trigger.
              tokens = [t for t in raw.split() if t and t != '--stage10c-fixture']
              args_out = ' '.join(tokens)
          print(f'[pipeline_runs] run_id={run_id} github_run_id={gh_run_id} args={args_out!r}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'run_id={run_id}\n')
              f.write(f'args={args_out}\n')
          PY

      - name: Run pipeline
        id: pipeline
        continue-on-error: true
        env:
          # When force_fail is true on a workflow_dispatch, point the pipeline at
          # an invalid URL so `08_supabase_sync` exhausts retries and the run
          # exits non-zero. All other secrets remain real so the post-step can
          # still update the pipeline_runs row.
          SUPABASE_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_fail == true) && 'https://invalid.example' || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_fail == true) && 'invalid' || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WHRB_PIPELINE_RUN_ID: ${{ steps.runrow.outputs.run_id }}
          # Stage 10c: admin-selected flags from /admin/runs (empty for
          # schedule / workflow_dispatch paths; defaults to --with-hic below).
          PIPELINE_ARGS_RAW: ${{ steps.runrow.outputs.args }}
          EVENT_NAME: ${{ github.event_name }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          mkdir -p cache
          # Stage 10c: honor admin-selected args on repository_dispatch.
          # Every token in PIPELINE_ARGS_RAW is server-side whitelist-validated
          # so word-splitting is safe. Empty args → legacy `--with-hic`.
          if [ "$EVENT_NAME" = "repository_dispatch" ] && [ -n "$PIPELINE_ARGS_RAW" ]; then
            echo "[run-pipeline] invoking: python pipeline.py $PIPELINE_ARGS_RAW"
            # shellcheck disable=SC2086  # intentional word-split on validated argv
            python pipeline.py $PIPELINE_ARGS_RAW 2>&1 | tee cache/pipeline.log
          else
            echo "[run-pipeline] invoking: python pipeline.py --with-hic (legacy)"
            python pipeline.py --with-hic 2>&1 | tee cache/pipeline.log
          fi

      - name: Finalize pipeline_runs row
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID: ${{ steps.runrow.outputs.run_id }}
          PIPELINE_STATUS: ${{ steps.pipeline.outcome }}
          FORCE_FAIL: ${{ inputs.force_fail }}
        run: |
          python - <<'PY'
          import os, re, sys
          from datetime import datetime, timezone
          from supabase import create_client
          run_id = os.environ.get('RUN_ID') or ''
          if not run_id:
              print('no run_id to finalize', file=sys.stderr)
              sys.exit(0)
          sb = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SERVICE_ROLE_KEY'])
          outcome = os.environ.get('PIPELINE_STATUS') or 'failure'
          force_fail = (os.environ.get('FORCE_FAIL') or '').lower() == 'true'
          status = 'success' if (outcome == 'success' and not force_fail) else 'failed'
          rows_upserted = None
          err = None
          log_path = 'cache/pipeline.log'
          tail = ''
          try:
              with open(log_path, encoding='utf-8', errors='replace') as f:
                  text = f.read()
              m = re.findall(r'\[pipeline_summary\] status=(\S+) rows_upserted=(\d*) error=(.*)', text)
              if m:
                  status_tok, rows_tok, err_tok = m[-1]
                  if rows_tok:
                      rows_upserted = int(rows_tok)
                  if err_tok.strip():
                      err = err_tok.strip()[:400]
                  # pipeline-reported status wins unless force_fail
                  if not force_fail:
                      status = status_tok
              # tail for error context on failure
              tail = text[-800:] if text else ''
          except FileNotFoundError:
              pass
          if status == 'failed' and not err:
              err = (tail or 'pipeline exited non-zero; no summary line emitted').strip()[:400]
          patch = {
              'status': status,
              'finished_at': datetime.now(tz=timezone.utc).isoformat(),
          }
          if rows_upserted is not None:
              patch['rows_upserted'] = rows_upserted
          if err:
              patch['error'] = err
          sb.table('pipeline_runs').update(patch).eq('id', run_id).execute()
          print(f'[pipeline_runs] finalized id={run_id} status={status} rows={rows_upserted}')
          PY

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: whrb-prospects/cache/*.log
          retention-days: 30
          if-no-files-found: warn

      - name: Fail the job if the pipeline step failed
        if: steps.pipeline.outcome != 'success'
        run: |
          echo "Pipeline step outcome was '${{ steps.pipeline.outcome }}'. See cache/pipeline.log artifact."
          exit 1

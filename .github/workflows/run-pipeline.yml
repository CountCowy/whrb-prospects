name: run-pipeline

on:
  # Triggered by the Supabase Edge Function `github-dispatch` when a
  # `pipeline_runs` row is INSERTed with status='queued' (the admin
  # "Trigger new run" button path).
  repository_dispatch:
    types: [pipeline_run]
  # Twice-monthly production cadence — 08:00 UTC on the 1st and 15th.
  schedule:
    - cron: '0 8 1,15 * *'
  # Manual trigger from the Actions UI for troubleshooting.
  workflow_dispatch:

concurrency:
  group: pipeline-run
  cancel-in-progress: false

jobs:
  run:
    name: Run pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: whrb-prospects
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: whrb-prospects/.python-version
          cache: pip
          cache-dependency-path: |
            whrb-prospects/requirements.lock
            whrb-prospects/requirements-dev.lock

      - name: Install dependencies (pinned lock)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(python -c "import playwright; print(playwright.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-py-${{ steps.pw.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-py-

      - name: Install Playwright Chromium (with deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Adopt or create pipeline_runs row
        id: runrow
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RUN_ID: ${{ github.event.client_payload.pipeline_run_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/dispatch_adopt_run.py

      - name: Run pipeline
        id: pipeline
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WHRB_PIPELINE_RUN_ID: ${{ steps.runrow.outputs.run_id }}
          # Admin-selected flags from /admin/runs on repository_dispatch.
          # Empty for schedule / workflow_dispatch (those default to --with-hic).
          PIPELINE_ARGS_RAW: ${{ steps.runrow.outputs.args }}
          EVENT_NAME: ${{ github.event_name }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          mkdir -p cache
          # Every token in PIPELINE_ARGS_RAW is server-side whitelist-validated
          # in /api/pipeline/run so word-splitting is safe.
          if [ "$EVENT_NAME" = "repository_dispatch" ] && [ -n "$PIPELINE_ARGS_RAW" ]; then
            echo "[run-pipeline] invoking: python pipeline.py $PIPELINE_ARGS_RAW"
            # shellcheck disable=SC2086  # intentional word-split on validated argv
            python pipeline.py $PIPELINE_ARGS_RAW 2>&1 | tee cache/pipeline.log
          else
            echo "[run-pipeline] invoking: python pipeline.py --with-hic"
            python pipeline.py --with-hic 2>&1 | tee cache/pipeline.log
          fi

      - name: Finalize pipeline_runs row
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID: ${{ steps.runrow.outputs.run_id }}
          PIPELINE_STATUS: ${{ steps.pipeline.outcome }}
        run: python scripts/dispatch_finalize_run.py

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: whrb-prospects/cache/*.log
          retention-days: 30
          if-no-files-found: warn

      - name: Fail the job if the pipeline step failed
        if: steps.pipeline.outcome != 'success'
        run: |
          echo "Pipeline step outcome was '${{ steps.pipeline.outcome }}'. See cache/pipeline.log artifact."
          exit 1

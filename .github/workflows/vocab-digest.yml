name: vocab-digest

# Daily digest of pending tag-vocabulary moderation notifications
# (Stage T3, plan §5.4). Compliance-axis rows are excluded from the
# digest entirely — they remain instant in the inbox.
#
# Cron fires at 13:00 UTC = 09:00 America/New_York (Eastern Daylight
# Time). Eastern Standard Time runs 14:00 UTC instead — accept the
# half-year drift; the digest is informational, not time-critical.
#
# Idempotent: a same-day re-run finds digested_at IS NULL filter empty
# and no-ops.

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview without writing'
        required: false
        default: false
        type: boolean

concurrency:
  group: vocab-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Run vocab_digest.py
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: whrb-prospects
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: whrb-prospects/.python-version
          cache: pip
          cache-dependency-path: whrb-prospects/requirements.lock

      - name: Install dependencies (pinned lock)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run vocab_digest.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            python scripts/vocab_digest.py --dry-run
          else
            python scripts/vocab_digest.py
          fi

name: pr-title

# Enforce conventional-commit style on PR titles. Commit history already
# uses this style (`feat(t7): ...`, `ci(t7): ...`, `fix(t7): ...`); this
# extends the same rule to PR titles so the squash-merge subject is
# consistent.

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types follow the repo's existing commit conventions.
          types: |
            feat
            fix
            ci
            chore
            docs
            refactor
            perf
            test
            style
            build
            revert
          # Scopes are open — the repo uses freeform scopes like (t7),
          # (web), (pipeline), (calendar), so no enum is enforced.
          requireScope: false
          # Subject must not start with an uppercase letter (matches
          # commit history: `ci: bump...`, not `ci: Bump...`).
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the PR title "{title}"
            should start with a lowercase letter.

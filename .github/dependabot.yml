# Dependabot config — three ecosystems live in this repo:
#
# 1. pip (whrb-prospects) — Python pipeline. Manifest is requirements.txt
#    + requirements-dev.txt; lockfiles are regenerated via pip-compile.
#    Dependabot updates the manifest; lockfile regen happens in PR review.
#
# 2. npm (whrb-web) — Next.js app. pnpm-lock.yaml is updated automatically.
#
# 3. github-actions — bumps action versions in .github/workflows/. This
#    is the channel that would have flagged the Node 20 deprecation.
#
# Weekly cadence chosen over daily to avoid PR spam; Monday morning
# America/New_York means PRs land while the week is fresh.
version: 2
updates:
  - package-ecosystem: pip
    directory: /whrb-prospects
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /whrb-web
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
      # Radix UI + Next.js + React travel together — group their major
      # bumps so the upgrade happens as one reviewable PR, not many.
      react-stack-major:
        patterns:
          - "react"
          - "react-dom"
          - "next"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

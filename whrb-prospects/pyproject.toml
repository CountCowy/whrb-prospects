[project]
name = "whrb-prospects"
version = "0.1.0"
description = "WHRB 95.3 FM Boston-area ad-sales prospect pipeline."
requires-python = ">=3.11"
authors = [{ name = "Yareh Constant" }]
license = { text = "Proprietary — Harvard Radio Broadcasting Co., Inc." }

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["cache", "output", "data", ".venv", "smoke_bench.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "TID", "RUF"]
ignore = [
    "E501",   # line length — many scraper URL constants are long on purpose
    "E701",   # pipeline.py scoring uses compact `if x: y` for tabular alignment
    "E741",   # `l` in a one-shot comprehension is not worth a rename
    "B008",   # default-arg function call (requests timeout kwargs rely on it)
    "B905",   # `zip(..., strict=)` is opinion, not correctness
    "SIM103", # return-condition-directly is cosmetic
    "SIM105", # contextlib.suppress is less legible than `try: ... except: pass`
    "SIM110", # for-any() equivalence prefers explicit early-return
    "SIM114", # if-with-same-arms occasionally clearer as two branches
    "RUF002", # en-dash in docstrings is intentional prose
]

[tool.ruff.lint.per-file-ignores]
# CLI integrity/resync scripts sys.path.insert before importing db/util, which is
# an intentional module-load-order workaround — E402 doesn't apply.
"scripts/*.py" = ["F841", "E402"]
"tests/*.py"   = ["B011", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending  = "auto"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
# Gradual typing baseline: enforce on the files Stage 5.5 touched plus the
# always-imported core. Scraper sources, ma_sos Playwright driver, program-book
# PDF parsers, and one-off scripts stay loose — they rely on BeautifulSoup /
# pandas / Playwright shapes that aren't worth fighting the type checker over
# yet. A follow-up PR can pull more modules into this list as they're cleaned.
files = [
    "config.py",
    "db/validators.py",
    "db/nonprofit_bmf.py",
    "enrich/dedupe.py",
    "util",
]
exclude = [
    "cache/",
    "output/",
    "data/",
    "tests/",
    ".venv/",
]

[[tool.mypy.overrides]]
# Third-party libraries without stubs — silence noisy import errors.
module = [
    "supabase.*",
    "tenacity.*",
    "rapidfuzz.*",
    "dotenv.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# Auto mode: any `async def test_*` is treated as an async test without
# requiring `@pytest.mark.asyncio` on every function. Enables the
# contact_scraper.py async coverage tier without per-test boilerplate.
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
# `source = ["."]` rather than an explicit dir/file list: when coverage
# is given a list of modules/files, it pre-imports them at startup to
# mark their files for measurement, which causes `pipeline.py` to load
# pandas/numpy before pytest collection runs — and numpy 2.x raises
# "cannot load module more than once per process" when the test suite's
# `test_pipeline_helpers.py` later does `import pipeline`. The omit list
# below is the regression-floor's actual filter; if you ever want a
# tighter `source` list, audit which files trigger imports first.
source = ["."]
omit = [
    "tests/*",
    "scripts/*",
    "cache/*",
    "output/*",
    "data/*",
    ".venv/*",
    "smoke_bench.py",
]

[tool.coverage.report]
# Regression floor. Pre-T7-tech-debt-sweep this was 28 (whole-package).
# The post-T7 sweep added Tier-1/2/3 tests on util/+enrich/ that lift
# combined coverage on those two packages above 70%. The whole-package
# floor is kept at 28 (sources/ remain HTTP-bound and out of scope);
# the 70% gate is enforced in CI via `pytest --cov=util --cov=enrich
# --cov-fail-under=70` as a separate, narrower check.
# Ratchet up as new tests land; do not loosen without a deliberate
# justification.
fail_under = 28
show_missing = true
skip_covered = false
